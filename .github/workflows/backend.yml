name: backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      # Full history, so SonarCloud can attribute issues to the commit that added them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # uv is pinned, and the install uses the committed uv.lock: --locked fails
      # if the lock is out of date, and --no-build refuses to run package build
      # scripts, so only pre-built wheels are installed.
      - name: Install
        run: |
          python -m pip install --only-binary :all: uv==0.13.1
          uv sync --locked --extra dev --no-build

      # Ordered cheapest-first, so a formatting slip fails in seconds rather
      # than after the whole suite has run.
      - name: Format
        run: uv run --no-sync ruff format --check .

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Type check
        run: uv run --no-sync mypy

      # Tests also write coverage.xml, which the Sonar scan below reads.
      - name: Tests
        run: uv run --no-sync pytest --cov=backend --cov-report=xml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json pins, and --ignore-scripts
      # refuses package install scripts, as --no-build does for the Python install.
      - name: Install frontend
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      # npm test runs the locked react-scripts from package.json, so nothing is
      # downloaded on demand as npx could. Jest writes lcov paths relative to
      # frontend/; Sonar resolves them from the repository root, so they are
      # rewritten to frontend/src/... before the scan.
      - name: Frontend tests
        working-directory: frontend
        env:
          CI: "true"
        run: |
          npm test -- --watchAll=false --coverage
          sed -i 's|^SF:src/|SF:frontend/src/|' coverage/lcov.info

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR }}
