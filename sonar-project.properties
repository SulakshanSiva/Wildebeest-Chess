sonar.projectKey=SulakshanSiva_Wildebeest-Chess
sonar.organization=sulakshansiva

# Scan the whole repository, so the frontend is analysed too. Test files are
# excluded from the sources here and listed as tests below, so Sonar never
# treats a test as code that itself needs covering.
sonar.sources=.
sonar.exclusions=.venv/**,frontend/node_modules/**,frontend/build/**,frontend/coverage/**,backend/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/setupTests.ts

sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/setupTests.ts
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Start-up wiring with no logic to test: the React entry point and the Tailwind config.
sonar.coverage.exclusions=frontend/src/index.tsx,frontend/tailwind.config.js

# The rule flags --no-build on the "uv run" lines in the workflow. That flag only
# matters for installs, and those lines run tools without installing anything,
# so the finding does not apply. This ignores the rule for this one file only.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/backend.yml
