sonar.projectKey=SulakshanSiva_Wildebeest-Chess
sonar.organization=sulakshansiva

# Scan the whole repository, so the frontend is analysed too.
sonar.sources=.
sonar.exclusions=.venv/**,frontend/node_modules/**,frontend/build/**,backend/tests/**

sonar.tests=backend/tests
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# The rule flags --no-build on the "uv run" lines in the workflow. That flag only
# matters for installs, and those lines run tools without installing anything,
# so the finding does not apply. This ignores the rule for this one file only.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/backend.yml
